apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-prod

resources:
  - namespace.yaml
  - ../../base

components:
  - ../../components/pdb

labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
    includeTemplates: true

configMapGenerator:
  - name: gitops-api-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - RUST_LOG=info

# --- Image: the ONLY field promotion changes. -------------------------------
# Promotion = copy this digest from the previous environment's overlay in a PR.
# Bootstrap value: local build (phase 4) served via the kind ghcr.io mirror;
# CI replaces it with the GHCR-published digest from phase 8 onward.
images:
  - name: gitops-api
    newName: ghcr.io/dapravith/gitops-api
    digest: sha256:4bfc7038e9ecfb9503c113d039dc14be0e4cd60e6a8ef11b2984c60059fbea8f

patches:
  - path: deployment-patch.yaml
