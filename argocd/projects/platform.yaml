# Project for Argo CD's own configuration (app-of-apps). It may only create
# Applications and AppProjects inside the argocd namespace, from this repo.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Argo CD configuration (AppProjects and Applications) managed from Git
  sourceRepos:
    - https://github.com/Dapravith/gitops-config.git
    # TRANSITION: remove the lab Git server once every Application reads GitHub.
    - http://git.lab-infra.svc.cluster.local/git/gitops-config.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
