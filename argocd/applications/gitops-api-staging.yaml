apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-api-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitops-api
    app.kubernetes.io/environment: staging
  # Deleting this Application also deletes its workloads (cascade).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gitops-nonprod
  source:
    repoURL: https://github.com/Dapravith/gitops-config.git
    targetRevision: main
    path: apps/gitops-api/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-staging
  revisionHistoryLimit: 10
  syncPolicy:
    # Manual approval gate: no `automated` block. Merging the promotion PR only
    # makes this Application OutOfSync; a human reviews `argocd app diff` and
    # runs `argocd app sync gitops-api-staging` (see docs/PROMOTION.md).
    # Consequence: drift is reported (OutOfSync), not reverted, as in prod.
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
