apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-api-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitops-api
    app.kubernetes.io/environment: staging
  # Deleting this Application also deletes its workloads (cascade).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gitops-nonprod
  source:
    repoURL: https://github.com/Dapravith/gitops-config.git
    targetRevision: main
    path: apps/gitops-api/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-staging
  revisionHistoryLimit: 10
  syncPolicy:
    # Git is the source of truth: apply on every commit, delete what Git
    # removed, revert manual drift.
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
