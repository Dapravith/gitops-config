apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Apply before the environment apps, which contain SealedSecrets (CRD first).
    argocd.argoproj.io/sync-wave: "-1"
  # No resources finalizer: deleting this Application must never cascade-delete
  # the controller namespace (which holds the private sealing key).
spec:
  project: cluster-addons
  source:
    repoURL: http://git.lab-infra.svc.cluster.local/git/gitops-config.git
    targetRevision: main
    path: platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
