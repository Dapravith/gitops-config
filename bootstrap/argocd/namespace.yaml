apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    # Verified: `kubectl label --dry-run=server ... enforce=restricted` reports no
    # violations for any Argo CD v3.5.7 pod, so enforce the strictest profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
