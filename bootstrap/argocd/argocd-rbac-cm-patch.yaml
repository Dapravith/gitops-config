apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  # Authenticated users without an explicit role get read-only access.
  policy.default: role:readonly
  # Release managers may sync prod; everyone else may only view it.
  # (Bind real SSO groups here once an IdP exists; admin keeps full access.)
  policy.csv: |
    p, role:release-manager, applications, sync, gitops-prod/*, allow
    p, role:release-manager, applications, get, */*, allow
    g, release-managers, role:release-manager
