server.modules = ("mod_alias", "mod_cgi", "mod_setenv", "mod_accesslog")
server.port = 8080
server.document-root = "/var/empty"
server.errorlog = "/dev/stderr"
accesslog.filename = "/dev/stderr"
server.pid-file = ""

# http://<host>:8080/git/<repo>.git  ->  /srv/git/<repo>.git (mounted read-only)
alias.url = ("/git" => "/usr/libexec/git-core/git-http-backend")
$HTTP["url"] =~ "^/git" {
  cgi.assign = ("" => "")
  setenv.add-environment = (
    "GIT_PROJECT_ROOT" => "/srv/git",
    "GIT_HTTP_EXPORT_ALL" => ""
  )
}
