# Local lab cluster for the GitOps project.
#
# Single node on purpose: the host Docker VM is shared with other workloads
# (~7.7 GiB total). The control-plane node is schedulable in kind, so app pods,
# Argo CD and Sealed Secrets all run on it. Add `- role: worker` entries to
# experiment with anti-affinity / node drains when resources allow.
#
# Node image pinned by digest (kind v0.33.0 release notes). v1.36 matches the
# local kubectl client (v1.36.1), keeping client/server skew at zero.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    labels:
      gitops-lab/role: all-in-one
networking:
  # API server only reachable from this machine.
  apiServerAddress: "127.0.0.1"
  apiServerPort: 0
# Let containerd read per-registry hosts.toml files. create-cluster.sh uses this
# to make the local registry a *mirror* for ghcr.io, so manifests can pin real
# `ghcr.io/...@sha256:` digests and still resolve before CI has pushed to GHCR.
# Digests are content addresses, so a mirror cannot substitute different bytes.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"
